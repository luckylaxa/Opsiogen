# Loads the starter content and images into Sanity.
# Run it from GitHub → Actions → "Seed Sanity" → Run workflow.
# Needs the repository secret SANITY_API_WRITE_TOKEN (Editor token).
#   add       (default) only creates what is missing; studio edits are kept.
#   overwrite replaces the starter services, case studies and the Work and
#             Services pages with the content in src/content/seed-data.ts
#             (see scripts/seed.ts for exactly what changes).
name: Seed Sanity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "add = only add what is missing · overwrite = replace the starter content"
        type: choice
        options: [add, overwrite]
        default: add

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 79m429dl
      NEXT_PUBLIC_SANITY_DATASET: production
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      SEED_MODE: ${{ inputs.mode }}
    steps:
      - name: Check the token secret is set
        run: |
          if [ -z "$SANITY_API_WRITE_TOKEN" ]; then
            echo "::error::Add the SANITY_API_WRITE_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:'Playfair Display';font-style:italic;font-weight:400;src:url(fonts/node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-italic.woff2)}
:root{--ink:#111418;--graphite:#6E737A;--mist:#F4F5F7;--blue:#4284C3;--green:#51B848;--lime:#DDF36A;--ivory:#FBF5E6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Inter,sans-serif;color:var(--ink)}
.m{position:relative;width:1440px;height:917px;overflow:hidden;margin:0 0 40px}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.dark .eyebrow{color:var(--green)}
.h{color:var(--ink);font-size:54px;line-height:1.04;letter-spacing:-.03em;font-weight:400;margin-top:14px}
.h i,.sub i{font-family:'Playfair Display',serif;font-style:italic;font-size:1.1em;letter-spacing:-.01em}
.dark{color:#fff}.dark .h i{color:var(--lime)}
.light .h i{color:var(--blue)}
.sub{font-size:19px;line-height:1.45;color:var(--graphite);margin-top:16px;max-width:30ch}
.dark .sub{color:#b9bec6}
.tl{position:absolute;left:72px;top:68px}
.bl{position:absolute;left:72px;bottom:64px}
.card{position:absolute;border-radius:18px;overflow:hidden;background:#ddd}
.card img,.screen img{display:block;width:100%;height:100%;object-fit:cover}
.phone{position:absolute;border-radius:54px;background:#0b0d10;padding:11px}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#000}
.island{position:absolute;top:13px;left:50%;width:27%;height:22px;margin-left:-13.5%;border-radius:12px;background:#000;z-index:3}
.logo{position:absolute;height:38px}
.foot{position:absolute;right:72px;bottom:64px;font-size:15px;color:var(--graphite)}
.dark .foot{color:#9aa0a8}
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(fonts/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(fonts/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2)}
/* LinkedIn post card and the redesigned pages (all sizes in em, so one page scales with its width) */
.post{position:absolute;background:#fff;border-radius:14px;color:var(--ink);overflow:hidden}
.post .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.post .av{width:40px;height:40px;border-radius:8px;background:var(--mist);display:grid;place-items:center;flex:none}
.post .av img{width:28px;height:auto}
.post .nm{font-size:13.5px;font-weight:600;line-height:1.3}.post .nm span{display:block;font-weight:400;color:var(--graphite);font-size:11.5px}
.post .tx{font-size:13px;line-height:1.45;padding:0 16px 12px;color:#2a2f36}
.post .bar{display:flex;justify-content:space-between;padding:9px 16px;font-size:11.5px;color:var(--graphite);border-top:1px solid #eceef1}
.post .act{display:flex;justify-content:space-around;padding:11px 8px;font-size:12.5px;font-weight:500;color:#59606a;border-top:1px solid #eceef1}
.pg{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;font-size:var(--u,3.2px)}
.pg .mono{font-family:'IBM Plex Mono',monospace;font-size:2.5em;letter-spacing:.08em;text-transform:uppercase}
.pg .hl{font-size:10.4em;line-height:1.03;letter-spacing:-.03em}
.pg .hl i{font-family:'Playfair Display',serif;font-style:italic;font-size:1.12em;letter-spacing:-.01em}
.pg .sl{font-size:3.6em;line-height:1.4;font-weight:500}
.pg .ft{position:absolute;left:7em;right:7em;bottom:6em;display:flex;justify-content:space-between;align-items:center;font-size:1em}
.pg .ft img{height:6.4em;width:auto}.pg .ft span{font-size:2.6em}
.pg .in{position:absolute;inset:8em 7em auto 7em}
.ink{background:var(--ink);color:#fff}.ink .hl i,.ink .mono{color:var(--lime)}.ink .sl{color:#c9ced6}.ink .ft span{color:#9aa0a8}
.mst{background:var(--mist)}.mst .hl i,.mst .mono{color:var(--blue)}.mst .sl,.mst .ft span{color:var(--graphite)}
.ivy{background:var(--ivory)}.ivy .hl i,.ivy .mono{color:var(--blue)}.ivy .sl,.ivy .ft span{color:var(--graphite)}
.blu{background:var(--blue);color:#fff}.blu .hl i{color:var(--ink)}.blu .sl{color:#e6effa}.blu .ft span{color:#e6effa}
.row{display:flex;gap:3em;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:3.1em;padding:2.1em 0;border-top:1px solid rgb(255 255 255/.14)}
.row b{font-weight:400;color:#8d949d;width:5.2em;flex:none}

<!doctype html>
<!-- The three out-of-home artworks for the case-study mockups and the showreel's "out of home" tiles, drawn flat at
     their panels' own proportions (measured on the photos) and rendered by render.cjs. Open with ?a=rs, ?a=nc or ?a=sl.
     rs: Rohde & Schwarz billboard, 2460 x 1000 (the night Earth is NASA's photo from the ISS).
     nc: Norsecom bus shelter poster, 1404 x 2000.
     sl: SandLogic digital screen, 2030 x 1150 (rendered at 2x). -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Outfit;font-weight:100 900;src:url(../../../../src/fonts/Outfit-Variable.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
.board{position:relative;overflow:hidden;display:none}
.board.on{display:block}

/* Rohde & Schwarz */
#rs{width:2460px;height:1000px;background:#03060c;font-family:Inter,sans-serif;color:#fff}
#rs .earth{position:absolute;left:560px;top:-180px;width:1900px}
#rs .fade{position:absolute;inset:0;background:linear-gradient(90deg,#03060c 0%,#03060c 27%,rgba(3,6,12,.86) 37%,rgba(3,6,12,0) 54%)}
#rs svg{position:absolute;inset:0}
#rs h1{position:absolute;left:112px;top:118px;font-weight:800;font-size:138px;line-height:1;letter-spacing:-.025em}
#rs p{position:absolute;left:116px;top:430px;font-weight:400;font-size:46px;letter-spacing:-.005em;color:rgba(255,255,255,.84)}
#rs .logo{position:absolute;left:116px;bottom:96px;height:118px}

/* Norsecom */
#nc{width:1404px;height:2000px;background:linear-gradient(180deg,#fff 0%,#fff 55%,#f3f8ff 100%);font-family:Poppins,sans-serif;color:#0b1220}
#nc .mark{position:absolute;right:-250px;bottom:-170px;width:1320px;opacity:.1}
#nc .logo{position:absolute;left:112px;top:124px;width:560px}
#nc h1{position:absolute;left:108px;top:372px;font-weight:600;font-size:128px;line-height:1.07;letter-spacing:-.012em}
#nc p{position:absolute;left:112px;top:972px;width:1180px;font-size:44px;line-height:1.45;color:#3b4657}
#nc .go{position:absolute;right:112px;bottom:124px;width:124px;height:124px;border-radius:50%;background:#0080ff;display:grid;place-items:center}

/* SandLogic */
#sl{width:2030px;height:1150px;font-family:Outfit,sans-serif;color:#fff;background:#cf4e4e}
#sl .side{position:absolute;left:0;top:0;width:690px;height:100%;background:#0b0a12}
#sl canvas{position:absolute;left:0;top:0}
#sl .logo{position:absolute;left:96px;top:110px;width:470px}
#sl .copy{position:absolute;left:810px;right:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
#sl h1{font-weight:600;font-size:150px;line-height:1.02;letter-spacing:-.02em;white-space:nowrap}
#sl p{margin-top:58px;font-weight:400;font-size:46px;color:rgba(255,255,255,.92);display:flex;gap:44px}
</style></head><body>

<div id="rs" class="board">
  <img class="earth" src="../photos/earth-night-nasa-Q1p7bh3SHj8.jpg" alt="">
  <div class="fade"></div>
  <svg width="2460" height="1000" id="links"></svg>
  <h1>From Bengaluru<br>to orbit.</h1>
  <p>Testing the links that connect India.</p>
  <img class="logo" src="rs-logo-white.png" alt="">
</div>

<div id="nc" class="board">
  <img class="mark" src="nc-mark.png" alt="">
  <img class="logo" src="nc-logo.png" alt="">
  <h1>Engineering<br>Intelligence.<br>Connecting<br>Possibilities.</h1>
  <p>Advanced embedded systems, IoT and connectivity<br>solutions built for a smarter future.</p>
  <div class="go"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>

<div id="sl" class="board">
  <div class="side"></div>
  <canvas id="dots" width="1380" height="2300" style="width:690px;height:1150px"></canvas>
  <img class="logo" src="sl-logo-dark.png" alt="">
  <div class="copy">
    <h1 id="slh">Where silicon<br>meets intelligence</h1>
    <p><span>Full-stack AI, built in Bengaluru.</span><span>sandlogic.com</span></p>
  </div>
</div>

<script src="earth-lights.js"></script>
<script>
const a = new URLSearchParams(location.search).get('a') || 'rs';
document.getElementById(a).classList.add('on');

// Rohde & Schwarz: thin links from a point in orbit down to the brightest city lights in the photo
(({ size, lights }) => {
  const k = 1900 / size[0], X = x => 560 + x * k, Y = y => -180 + y * k;
  const sat = [1770, 92], svg = document.getElementById('links');
  const pick = lights.map(([x, y]) => [X(x), Y(y)]).filter(([x, y]) => x > 1300 && x < 2400 && y > 430 && y < 800).slice(0, 8);
  let s = '<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>';
  pick.forEach(([x, y], i) => s += `<linearGradient id="l${i}" gradientUnits="userSpaceOnUse" x1="${sat[0]}" y1="${sat[1]}" x2="${x}" y2="${y}"><stop offset="0" stop-color="#bfe0ff" stop-opacity=".15"/><stop offset="1" stop-color="#e6f3ff" stop-opacity=".85"/></linearGradient>`);
  s += '</defs>';
  pick.forEach(([x, y], i) => {
    s += `<line x1="${sat[0]}" y1="${sat[1]}" x2="${x}" y2="${y}" stroke="url(#l${i})" stroke-width="5" filter="url(#g)" opacity=".55"/>`;
    s += `<line x1="${sat[0]}" y1="${sat[1]}" x2="${x}" y2="${y}" stroke="url(#l${i})" stroke-width="1.6"/>`;
    s += `<circle cx="${x}" cy="${y}" r="10" fill="#fff6dc" opacity=".35" filter="url(#g)"/><circle cx="${x}" cy="${y}" r="3.2" fill="#fff"/>`;
  });
  s += `<circle cx="${sat[0]}" cy="${sat[1]}" r="16" fill="#cfe6ff" opacity=".45" filter="url(#g)"/><circle cx="${sat[0]}" cy="${sat[1]}" r="4.5" fill="#fff"/>`;
  svg.innerHTML = s;
  if (a === 'rs') document.fonts.ready.then(() => document.body.dataset.ready = '1');
})(window.LIGHTS);

// SandLogic: the brand's dot field (as on its brand board), red to violet, on the dark side panel
(() => {
  const c = document.getElementById('dots'), g = c.getContext('2d'); g.scale(2, 2);
  const W = 690, H = 1150, mix = (p, q, t) => p.map((v, i) => Math.round(v + (q[i] - v) * t));
  for (let row = 0; row < 46; row++) for (let col = 0; col < 40; col++) {
    const u = col / 39, v = row / 45;
    const x = 30 + u * (W - 60) + 26 * Math.sin(v * 5.2 + u * 2.0);
    const y = 300 + v * (H - 330) + 38 * Math.sin(u * 4.4 + v * 1.7);
    const wave = .5 + .5 * Math.sin(u * 6.0 - v * 4.2);
    const fade = Math.min(1, Math.max(0, (y - 360) / 260)) * Math.min(1, (H - y) / 60);
    const r = .8 + 2.6 * wave * fade;
    if (r < .8) continue;
    const [cr, cg, cb] = mix([207, 78, 78], [122, 110, 214], Math.min(1, Math.max(0, u * .9 + (1 - v) * .4 - .1)));
    g.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(1, (.5 + .7 * wave) * fade)})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
})();

// Fit the SandLogic headline to its column
document.fonts.ready.then(() => {
  const h = document.getElementById('slh'), box = h.parentElement;
  let fs = 150; while (h.scrollWidth > box.clientWidth && fs > 60) h.style.fontSize = (fs -= 2) + 'px';
  if (a !== 'rs') document.body.dataset.ready = '1';
});
</script>
</body></html>

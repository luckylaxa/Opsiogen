<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css><style>
body{width:1260px;height:1000px;background:linear-gradient(180deg,#e9c9a8 0%,#d9a47c 55%,#b9744f 100%);position:relative;overflow:hidden}

<!doctype html>
<meta charset="utf-8">
<title>Opsiogen showreel</title>
<style>
@font-face{font-family:Outfit;src:url(../../../src/fonts/Outfit-Variable.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#08080c;font-family:Outfit,sans-serif}
.s{position:absolute;inset:0;overflow:hidden;display:none}
.s img{display:block}
.abs{position:absolute;left:0;top:0;will-change:transform}
.big{font-weight:700;line-height:.95;letter-spacing:-.035em;text-transform:uppercase;text-align:center}
.big span{display:inline-block;white-space:pre}
</style>
<body>
<script src="manifest.js"></script>
<script>
// The whole film as one timeline: window.setT(seconds) draws any moment, window.DUR is its length.
// Shots are added one after another (the cursor T moves on by each shot's length), so the cut is easy to re-time.
const W=1920,H=1080,A='a/',MAN=window.MANIFEST;
const COAL='#08080c',PAPER='#f4f2ee',PINK='#ff4f9b',VIOLET='#a98bff',AQUA='#5cf2e6',BLUE='#3f7bff',ORANGE='#ff8a3c',SUN='#ffd75e',LIME='#b6f36a';
const clamp=p=>Math.min(1,Math.max(0,p)), ease=p=>1-Math.pow(1-clamp(p),3), io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, lerp=(a,b,p)=>a+(b-a)*p;
// A quick entrance that overshoots a little and settles.
const pop=p=>{p=clamp(p);const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const IN=.2; // seconds an element takes to arrive
const scenes=[]; let T=0;
const el=(tag,cls,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);parent&&parent.appendChild(e);return e};
const img=(k,parent,w,h,style)=>{const i=el('img','',parent,Object.assign({width:w+'px',height:h+'px',objectFit:'cover'},style||{}));i.src=A+k+(k.startsWith('ch-')?'.png':'.jpg');return i};
// Never larger than the image itself, so nothing is blown up and soft.
const cap=(k,w)=>Math.min(w,MAN[k][0]);
// Every shot lasts a whole number of half-beats of the music (140 beats a minute), so each cut lands on it.
// The tempo and a few extra half-beats for the closing words come from the address (?bpm=134&pad=1), one set per track.
const ARG=new URLSearchParams(location.search),BPM=Number(ARG.get('bpm')||140),PAD=Number(ARG.get('pad')||0);
const Q=60/BPM/2;let KIND='shot';
function add(dur,build,flex){dur=Math.max(1,Math.round(dur/Q))*Q;const root=el('div','s',document.body);if(flex){root.dataset.flex=1;Object.assign(root.style,{alignItems:'center',justifyContent:'center',flexDirection:'column'})}const draw=build(root);scenes.push({t0:T,t1:T+dur,root,draw,kind:KIND});KIND='shot';T+=dur}
const box=(k,root,w,x,y,rad)=>{const [iw,ih]=MAN[k];const h=w*ih/iw;const b=el('div','abs',root,{width:w+'px',height:h+'px',left:x-w/2+'px',top:y-h/2+'px',borderRadius:(rad??20)+'px',overflow:'hidden'});img(k,b,w,h);return b};
const words=(text,parent,style)=>{const h=el('div','big',parent,style);return [h,text.split(' ').map((w,i,a)=>{const s=el('span','',h);s.textContent=w+(i<a.length-1?' ':'');return s})]};
const rise=(ws,tt,step=.05,d=.24,dy=90)=>ws.forEach((s,i)=>{const q=ease((tt-i*step)/d);s.style.transform=`translateY(${(1-q)*dy}px)`;s.style.opacity=q});

// Our character: floats, blinks once, never stretched.
function character(root,size,x,y,pose='front'){const c=el('div','abs',root,{width:size+'px',height:size+'px',left:x-size/2+'px',top:y-size/2+'px'});
  const a=img('ch-'+pose,c,size,size,{position:'absolute',objectFit:'contain'}),b=img('ch-blink',c,size,size,{position:'absolute',objectFit:'contain'});
  return (tt,blinkAt=.55)=>{const q=pop(tt/.32);c.style.transform=`translateY(${(1-q)*-size*1.2+Math.sin(tt*5)*8}px)`;const bl=tt>blinkAt&&tt<blinkAt+.12;b.style.opacity=bl?1:0;a.style.opacity=bl?0:1}}

// The opening: the character arrives, then two lines.
function opening(){
  add(1.5,root=>{root.style.background=COAL;const ch=character(root,330,W/2,330,'front');const [h,ws]=words('You bring the idea.',root,{position:'absolute',left:0,right:0,top:'560px',color:PAPER,fontSize:'176px'});
    return (p,tt)=>{ch(tt,.8);rise(ws,tt-.25)}});
  add(1.5,root=>{root.style.background=COAL;const ch=character(root,330,W/2,330,'down');const [h,ws]=words('We take it from here.',root,{position:'absolute',left:0,right:0,top:'560px',color:PAPER,fontSize:'176px'});
    return (p,tt)=>{ch(tt+1,9);rise(ws,tt)}})}

// A chapter's words on one flat colour, the character looking on.
function word(dur,text,bg){KIND='word';add(dur,root=>{root.style.background=bg;const [h,ws]=words(text,root,{color:COAL,fontSize:'210px',padding:'0 100px'});const ch=character(root,230,W-250,H-230,'upleft');
  return (p,tt)=>{rise(ws,tt,.06,.22,120);h.style.transform=`scale(${1+p*.03})`;ch(tt,.5)}},true)}

// A service name: two short lines snapping in from opposite sides.
function msg(dur,l1,l2,bg,fg){KIND='msg';add(dur,root=>{root.style.background=bg;const a=el('div','big',root,{color:fg,fontSize:'150px'});a.textContent=l1;const b=l2?el('div','big',root,{color:PAPER,fontSize:'150px',marginTop:'14px'}):null;if(b)b.textContent=l2;
  return (p,tt)=>{const q=ease(tt/.2);a.style.transform=`translateX(${(1-q)*-700}px)`;a.style.opacity=q;if(b){const r=ease((tt-.07)/.2);b.style.transform=`translateX(${(1-r)*700}px)`;b.style.opacity=r}}},true)}

// One desktop screen as a card.
function screen(dur,k,bg,o={}){add(dur,root=>{root.style.background=bg;const b=box(k,root,cap(k,o.w||1500),W/2,H/2+(o.dy||0));
  return (p,tt)=>{const q=pop(tt/IN);b.style.transform=`translateY(${(1-q)*(o.from||360)}px) scale(${lerp(.9,1,q)+p*.025})`}})}

// Two screens, one over the other.
function duo(dur,ka,kb,bg){add(dur,root=>{root.style.background=bg;const a=box(ka,root,cap(ka,1150),700,440),b=box(kb,root,cap(kb,1150),1230,650);
  return (p,tt)=>{const q=pop(tt/IN),r=pop((tt-.07)/IN);a.style.transform=`translate(${(1-q)*-500-p*24}px,${-p*14}px)`;b.style.transform=`translate(${(1-r)*600+p*24}px,${(1-r)*160+p*10}px)`}})}

// A row of tall screens (phones, stories) sliding sideways.
function row(dur,keys,bg,o={}){add(dur,root=>{root.style.background=bg;const h=o.h||840,gap=o.gap||40;const wrap=el('div','abs',root,{top:(H-h)/2+'px',height:h+'px',display:'flex',gap:gap+'px'});let total=0;
  const items=keys.map(k=>{const [iw,ih]=MAN[k];const w=h*iw/ih;const b=el('div','',wrap,{width:w+'px',height:h+'px',borderRadius:(o.rad||44)+'px',overflow:'hidden',flex:'none'});img(k,b,w,h);total+=w+gap;return b});
  return (p,tt)=>{wrap.style.transform=`translateX(${lerp(60,W-total-20,io(p))}px) rotate(${o.rot||0}deg)`;items.forEach((b,i)=>{const q=pop((tt-i*.025)/IN);b.style.transform=`translateY(${(1-q)*(i%2?220:-220)}px)`})}})}

// Three phones, the middle one larger.
function trio(dur,keys,bg,still){add(dur,root=>{root.style.background=bg;const hs=[740,920,740],xs=[440,960,1480];
  const items=keys.map((k,i)=>{const [iw,ih]=MAN[k];const h=hs[i],w=h*iw/ih;const b=el('div','abs',root,{width:w+'px',height:h+'px',left:xs[i]-w/2+'px',top:(H-h)/2+'px',borderRadius:'50px',overflow:'hidden'});img(k,b,w,h);return b});
  return (p,tt)=>{items.forEach((b,i)=>{const q=still?1:pop((tt-[.05,0,.1][i])/IN);b.style.transform=`translateY(${(1-q)*760-p*[14,26,14][i]}px) rotate(${[-5,0,5][i]}deg)`})}})}

// Several pictures side by side (square brand photos, posts).
function tiles(dur,keys,bg,o={}){add(dur,root=>{root.style.background=bg;const n=keys.length,gap=o.gap||36,w=Math.min(o.w||560,(W-160-gap*(n-1))/n);const x0=(W-(n*w+(n-1)*gap))/2+w/2;
  const items=keys.map((k,i)=>box(k,root,cap(k,w),x0+i*(w+gap),H/2,o.rad??20));
  return (p,tt)=>{items.forEach((b,i)=>{const q=pop((tt-i*.045)/IN);b.style.transform=`translateY(${(1-q)*(i%2?-420:420)}px) scale(${1+p*.02})`})}})}

// Columns of work moving past each other, the wall turned a little.
function cols(dur,columns,bg,o={}){add(dur,root=>{root.style.background=bg;const n=columns.length,gap=o.gap||26,cw=o.cw||520;const wall=el('div','abs',root,{left:W/2+'px',top:H/2+'px'});
  const cs=columns.map((keys,ci)=>{const c=el('div','abs',wall,{left:(ci-(n-1)/2)*(cw+gap)-cw/2+'px',width:cw+'px'});let y=0;keys.concat(keys).forEach(k=>{const [iw,ih]=MAN[k];const h=cw*ih/iw;const b=el('div','',c,{width:cw+'px',height:h+'px',marginBottom:gap+'px',borderRadius:(o.rad||16)+'px',overflow:'hidden'});img(k,b,cw,h);y+=h+gap});return {c,half:y/2}});
  const travel=o.travel||900;
  return p=>{wall.style.transform=`rotate(${o.rot??-9}deg)`;cs.forEach(({c,half},i)=>{c.style.transform=`translateY(${-half*.5-(i%3)*90+(i%2?1:-1)*(p-.5)*travel-H*.25}px)`})}})}

// One creative, large, on a flat colour.
function poster(dur,k,bg,o={}){add(dur,root=>{root.style.background=bg;const [iw,ih]=MAN[k];const h=Math.min(o.h||900,ih),w=h*iw/ih;const b=box(k,root,w,W/2,H/2,18);
  return p=>{b.style.transform=`scale(${lerp(1.07,1,ease(p*3))}) rotate(${o.rot||0}deg)`}})}

// One picture filling the screen (only for pictures at least as large as the screen).
function full(dur,k){add(dur,root=>{root.style.background=COAL;const [iw,ih]=MAN[k];const sc=Math.max(W/iw,H/ih),w=iw*sc,h=ih*sc;const i=img(k,root,w,h,{position:'absolute',left:(W-w)/2+'px',top:(H-h)/2+'px'});
  return p=>{i.style.transform=`scale(${lerp(1.06,1,ease(p*1.6))})`}})}

// A website and its phone app side by side.
function webapp(dur,kw,kp,bg){add(dur,root=>{root.style.background=bg;const a=box(kw,root,cap(kw,1240),760,H/2),b=box(kp,root,cap(kp,390),1640,H/2,44);
  return (p,tt)=>{const q=pop(tt/IN),r=pop((tt-.07)/IN);a.style.transform=`translateX(${(1-q)*-900}px)`;b.style.transform=`translateY(${(1-r)*900}px)`}})}

// A website clip playing in a browser card: the frames are drawn on a canvas, so every frame is exact.
const CLIPS={};
function clip(dur,k,bg,o={}){add(dur,root=>{root.style.background=bg;const [iw,ih,n]=MAN[k];const w=Math.min(o.w||1500,iw),h=w*ih/iw;
  const b=el('div','abs',root,{width:w+'px',height:h+'px',left:(W-w)/2+'px',top:(H-h)/2+'px',borderRadius:'18px',overflow:'hidden',background:'#fff'});
  const c=el('canvas','',b,{width:w+'px',height:h+'px',display:'block'});c.width=iw;c.height=ih;const ctx=c.getContext('2d');
  const fr=CLIPS[k]||(CLIPS[k]=[...Array(n)].map((_,i)=>{const im=new Image();im.src=A+'clips/'+k.slice(5)+'/f'+String(i+1).padStart(3,'0')+'.jpg';return im}));
  return (p,tt)=>{const q=pop(tt/IN);b.style.transform=`translateY(${(1-q)*(o.from??380)}px) scale(${lerp(.9,1,q)})`;const im=fr[Math.min(n-1,Math.floor((tt+(o.start||0))*30))];if(im.complete)ctx.drawImage(im,0,0)}})}

// A piece of illustration, large and still, with a slow push in.
function art(dur,k,bg){add(dur,root=>{root.style.background=bg;const b=box(k,root,cap(k,1280),W/2,H/2,22);
  return (p,tt)=>{const q=pop(tt/IN);b.style.transform=`scale(${lerp(.86,1,q)+p*.05})`}})}

// Three landscape ads stepping in.
function stack(dur,keys,bg){add(dur,root=>{root.style.background=bg;const items=keys.map((k,i)=>box(k,root,cap(k,720),520+i*440,300+i*240,14));
  return (p,tt)=>{items.forEach((b,i)=>{const q=pop((tt-i*.07)/IN);b.style.transform=`translateX(${(1-q)*(i%2?1100:-1100)}px)`})}})}

// The closing: the words over a wall of the work, one line, then our logo exactly as it is.
function closing(columns){
  add(12*(60/140/2)+PAD*Q,root=>{root.style.background=COAL;const n=columns.length,gap=22,cw=430;const wall=el('div','abs',root,{left:W/2+'px',top:H/2+'px'});
    const cs=columns.map((keys,ci)=>{const c=el('div','abs',wall,{left:(ci-(n-1)/2)*(cw+gap)-cw/2+'px',width:cw+'px'});let y=0;keys.concat(keys).forEach(k=>{const [iw,ih]=MAN[k];const h=cw*ih/iw;const b=el('div','',c,{width:cw+'px',height:h+'px',marginBottom:gap+'px',borderRadius:'14px',overflow:'hidden'});img(k,b,cw,h);y+=h+gap});return {c,half:y/2}});
    const shade=el('div','abs',root,{width:W+'px',height:H+'px',background:COAL,opacity:.7});
    const bx=el('div','abs',root,{width:W+'px',height:H+'px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'});
    const l1=el('div','big',bx,{fontSize:'150px',color:PAPER});l1.textContent='Your idea.';
    const l2=el('div','big',bx,{fontSize:'84px',marginTop:'30px',display:'flex',gap:'30px'});const cl=[VIOLET,AQUA,ORANGE,SUN];
    const ws=['Designed.','Built.','Branded.','Launched.'].map((w,i)=>{const s=el('span','',l2,{color:cl[i]});s.textContent=w;return s});
    return (p,tt)=>{wall.style.transform=`rotate(-9deg) scale(${lerp(1.25,.9,io(p))})`;cs.forEach(({c,half},i)=>{c.style.transform=`translateY(${-half*.5-(i%3)*80+(i%2?1:-1)*(p-.5)*300-H*.25}px)`});
      const q1=ease(tt/.22);l1.style.transform=`translateY(${(1-q1)*70}px)`;l1.style.opacity=q1;
      ws.forEach((s,i)=>{const q=ease((tt-.35-i*.26)/.2);s.style.transform=`translateY(${(1-q)*60}px)`;s.style.opacity=q})}});
  add(1.3,root=>{root.style.background=COAL;const a=el('div','big',root,{color:PAPER,fontSize:'150px'});a.textContent='One partner.';const b=el('div','big',root,{color:AQUA,fontSize:'150px',marginTop:'14px'});b.textContent='Every digital need.';
    return (p,tt)=>{const q=ease(tt/.2);a.style.transform=`translateX(${(1-q)*-700}px)`;a.style.opacity=q;const r=ease((tt-.07)/.2);b.style.transform=`translateX(${(1-r)*700}px)`;b.style.opacity=r}},true);
  add(2.6,root=>{root.style.background=COAL;const ch=character(root,250,W/2,300,'front2');
    // The logo keeps its own shape: its real size, no scaling or turning, only fading in.
    const logo=el('img','abs',root,{width:'800px',height:'132px',left:(W-800)/2+'px',top:'500px'});logo.src='../../../src/assets/opsiogen-logo-on-dark.png';
    const tag=el('div','abs',root,{width:W+'px',top:'700px',textAlign:'center',color:PAPER,fontSize:'56px',fontWeight:500,letterSpacing:'-.01em'});tag.textContent='Let’s make yours.';
    return (p,tt)=>{ch(tt,1.2);logo.style.opacity=ease((tt-.15)/.3);const q=ease((tt-.45)/.3);tag.style.opacity=q;tag.style.transform=`translateY(${(1-q)*24}px)`}})}

function build(){
  opening();
  // Teaser: eight flashes, each a different kind of work.
  const f=.2;
  trio(f,['omg-17','omg-16','omg-19'],PINK,true);screen(f,'t-pd-product',BLUE,{from:0,w:1300});screen(f,'slp-mark','#16113a',{from:0});screen(f,'slp-board','#16113a',{from:0});
  full(f,'va-hero');screen(f,'t-print-packaging',SUN,{from:0,w:1300});screen(f,'tv-identity','#17171c',{from:0,w:1300});poster(f,'af-az1',BLUE);

  word(.95,'We design it.',VIOLET);
  msg(.7,'AI Product Design','& Design Systems',COAL,VIOLET);
  row(1.05,['omg-01','omg-02','omg-04','omg-06','omg-10','omg-12','omg-15','omg-22','omg-34'],'#141418',{rot:-4});
  screen(.55,'mf-03','#1c1c22');
  clip(.75,'clip-sf','#0f3a2c',{start:.3});
  trio(.55,['omg-21','omg-18','omg-14'],SUN);
  screen(.55,'surgo-03','#0f2a1e');
  screen(.55,'t-pd-system',ORANGE,{w:1400});
  screen(.5,'mf-06','#1c1c22');
  msg(.7,'AI MVPs','& Business Apps',COAL,SUN);
  screen(.55,'t-mvp-booking',AQUA,{w:1400});
  webapp(.6,'va-web','va-app','#0e3d2b');
  screen(.55,'t-mvp-portal',PINK,{w:1400});
  trio(.5,['omg-31','omg-11','omg-36'],VIOLET);
  msg(.7,'AI','Automation',COAL,BLUE);
  screen(.6,'va-auto','#0e3d2b',{w:1400});
  screen(.55,'t-automation-dashboards',SUN,{w:1400});

  word(.95,'We build it.',AQUA);
  msg(.7,'AI Websites','& Revamps',COAL,AQUA);
  clip(.85,'clip-bt','#0b1020');
  clip(.75,'clip-cn','#2a0f0e',{start:.2});
  screen(.5,'w-oriel',SUN,{w:1400});
  clip(.75,'clip-ev',PAPER,{start:.4});
  screen(.5,'w-avelle-v2','#13324a',{w:1400});
  clip(.6,'clip-cb',BLUE,{start:.3});

  word(.95,'We brand it.',ORANGE);
  msg(.7,'AI Brand','Services',COAL,ORANGE);
  screen(.5,'slg-cover',PAPER,{w:1500});
  screen(.45,'slg-logo2','#16113a',{w:1500});
  screen(.45,'slg-colours',PAPER,{w:1500});
  screen(.45,'slg-gradient','#16113a',{w:1500});
  screen(.45,'slp-system',VIOLET,{w:1500});
  screen(.45,'slp-colour','#0f0d24',{w:1500});
  screen(.45,'tv-guidelines','#17171c',{w:1500});
  screen(.45,'va-badge','#0e3d2b',{w:1500});
  msg(.7,'AI Print','& Collateral Design',COAL,PINK);
  screen(.45,'slp-brochure','#16113a',{w:1500});
  screen(.45,'t-print-stationery',ORANGE,{w:1400});
  screen(.45,'slp-stationery',PAPER,{w:1500});
  screen(.45,'t-print-merch',BLUE,{w:1400});
  screen(.45,'t-print-posters',SUN,{w:1400});
  screen(.45,'t-print-events',VIOLET,{w:1400});

  word(.95,'We launch it.',SUN);
  msg(.7,'AI Social Media','Marketing',COAL,SUN);
  screen(.55,'slp-social','#16113a',{w:1500});
  screen(.5,'t-social-posts',PINK,{w:1400});
  row(.95,['af-s1','af-st-az','af-s3','af-st-mv','af-s5','af-st-th'],BLUE,{h:800,rad:26,gap:34,rot:3});
  screen(.5,'t-social-reels',AQUA,{w:1400});
  [['va-post','#0e3d2b'],['af-ad-ge',SUN],['slg-social',PAPER],['af-az4',PINK]].forEach(([k,c],i)=>MAN[k][0]>=MAN[k][1]*1.4?screen(.3,k,c,{w:1500,from:0}):poster(.3,k,c,{rot:i%2?2:-2}));
  msg(.7,'AI Video','Production',COAL,ORANGE);
  screen(.5,'t-video-ads',VIOLET,{w:1400});
  screen(.5,'t-video-motion',SUN,{w:1400});
  screen(.5,'t-video-explainer',BLUE,{w:1400});
  msg(.7,'Digital','Marketing',COAL,LIME);
  screen(.5,'t-digital-email',ORANGE,{w:1400});
  screen(.45,'va-billboard','#0e3d2b',{w:1500});
  screen(.5,'t-digital-analytics',AQUA,{w:1400});
  screen(.45,'t-subscription-ads',PINK,{w:1400});

  closing([['omg-16','slp-mark','af-az1','t-print-packaging','mf-03'],['w-oriel','tv-identity','omg-09','slg-gradient','t-social-posts'],['slp-mobile','surgo-03','va-hero','af-s1','slp-board'],['t-video-ads','omg-17','slp-colour','va-post','t-mvp-booking'],['af-ad-ge','slg-logo2','w-avelle-v2','omg-01','t-print-merch'],['tv-rollout','mf-06','af-plan','slp-social','t-pd-redesign']]);
}
window.setT=t=>{for(const s of scenes){const on=t>=s.t0&&t<s.t1;s.root.style.display=on?(s.root.dataset.flex?'flex':'block'):'none';if(on){const tt=t-s.t0;s.draw(tt/(s.t1-s.t0),tt)}}};
window.ready=(async()=>{build();window.DUR=T;window.CUTS=scenes.map(s=>+s.t0.toFixed(4));window.Q=Q;window.KINDS=scenes.map(s=>s.kind);await document.fonts.load('700 100px Outfit');await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>{}):0));window.setT(0);return {shots:scenes.length,dur:T}})();
</script>

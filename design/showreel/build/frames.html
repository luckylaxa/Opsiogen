// ---------- Motion for the film (cut 7) ----------
// Our own motion. Every piece springs in fast (0.2 s, a little overshoot) and keeps drifting, and our character, the
// ball with the camera eye from the Home hero, runs through the film: it turns up beside the people, the camera dives
// into its eye and the work opens out of it, it zips through the grid and the work changes in its wake, it hops along
// the chapter words and stamps them in, bounces on the beat on the closing words, watches the spine type and lands on
// the logo. It runs only for the film (the address ends in |anim; |alpha draws only the character, to lay over a stock
// clip). window.anim(t,d) draws t seconds into a shot d seconds long. The approved stills never run it.
const BEAT=60/140,clamp=p=>Math.min(1,Math.max(0,p)),ease=p=>1-Math.pow(1-clamp(p),3);
const io=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const pop=p=>{p=clamp(p);const c=2.5;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const IN=.2,NAME=SHOTS[n][1],HASH=location.hash.split('|'),MOTION=HASH[3]==='anim',ALPHA=MOTION&&HASH[4]==='alpha';
const UNDER=decodeURIComponent(HASH[2]||'');
let under=null;
if(MOTION&&UNDER){under=document.createElement('img');under.src='file://'+UNDER;Object.assign(under.style,{position:'absolute',left:0,top:0,width:'1920px',height:'1080px',display:'none'});document.body.insertBefore(under,f)}
// Our character: the ball in six poses (ball.py, all one size) and its glow. at(x,y,D,o) puts the sphere's centre at
// x,y and makes it D across; o.pose, o.rot (it turns about its centre), o.mirror, o.op, and o.floor: the line it
// stands on (its glow sits under it and shrinks as it jumps; no floor, no glow). It is solid and never changes shape

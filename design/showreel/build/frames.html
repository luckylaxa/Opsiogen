  phones.forEach((e,i)=>{const b=base(e);let dx=0,dy=760,dl=[.05,0,.1][i]??i*.05,dr=[[-18,6],[0,-14],[18,6]][i]||[0,0],r0=[-16,12,18][i]??0;
    if(browsers.length){dx=0;dy=900;dl=.07;dr=[0,-14];r0=10}
    else if(n%3===2&&!T.startsWith('Three apps')){dx=1500+i*320;dy=i%2?220:-220;dl=i*.03;r0=i%2?10:-10}   // cut 5's row: in from the right as a row
    else if(n%2){dx=i===1?0:(i?900:-900);dy=i===1?-900:0;dl=[0,.05,0][i]??0}
    add((t,d)=>{const q=pop((t-dl)/IN),k=t/d;e.style.transform=`translate(${(1-q)*dx+dr[0]*k}px,${(1-q)*dy+dr[1]*k}px) rotate(${(1-q)*r0}deg) ${b}`});
    if(T.startsWith('Three apps')){const ov=el('div','',e,{position:'absolute',inset:'13px',borderRadius:'52px',background:'#0b0b0e'});const t0=.3+i*.07;add(t=>{ov.style.opacity=1-clamp((t-t0)/.08)})}});
  // Browsers: rise (or slide in) and drift up against the phone.
  browsers.forEach(e=>{const b=base(e);add((t,d)=>{const q=pop(t/IN),k=t/d;e.style.transform=`translate(${(1-q)*-900}px,${-14*k}px) rotate(${(1-q)*-6}deg) scale(${.94+.06*q}) ${b}`})});
  // Pairs of cards: three patterns in turn, then they drift apart.
  const cards=[...f.querySelectorAll('.card')],pairs=cards.filter(e=>e.classList.contains('pair'));
  if(pairs.length===2){const k=n%3;pairs.forEach((e,i)=>{const b=base(e),from=k===0?[i?560:-560,0]:k===1?[0,i?-460:460]:[0,240],s0=k===2?.82:1,dl=i*.06,dr=i?18:-18;
    add((t,d)=>{const q=pop((t-dl)/IN),kk=t/d;e.style.transform=`translate(${(1-q)*from[0]+dr*kk}px,${(1-q)*from[1]}px) rotate(${(1-q)*(i?9:-9)*(k===2?-1:1)}deg) scale(${s0+(1-s0)*q}) ${b}`;if(k===2)e.style.opacity=clamp((t-dl)/.08)})})}
  // Cut 5's tiles: they fly in from above and below in turn. Cut 5's duo: one from the left, the other from the right
  // and below, then they drift apart.
  cards.filter(e=>e.classList.contains('tile5')).forEach((e,i)=>add((t,d)=>{const q=pop((t-i*.045)/IN),k=t/d;e.style.transform=`translateY(${(1-q)*(i%2?-420:420)}px) rotate(${(1-q)*(i%2?7:-7)}deg) scale(${1+.02*k})`}));
  cards.filter(e=>e.classList.contains('duo')).forEach((e,i)=>add((t,d)=>{const q=pop((t-i*.07)/IN),k=t/d;
    e.style.transform=i?`translate(${(1-q)*600+k*24}px,${(1-q)*160+k*10}px) rotate(${(1-q)*8}deg)`:`translate(${(1-q)*-500-k*24}px,${-k*14}px) rotate(${(1-q)*-8}deg)`}));
  // Other cards and fitted pieces: each from its nearest edge, one after another, then they drift outward.
  const rest=cards.filter(e=>!['pair','tile','tile5','duo'].some(c=>e.classList.contains(c)));
  if(rest.length>=4)late.push(()=>{const rs=rest.map(e=>e.getBoundingClientRect());   // cut 5's tilted wall: it straightens into place
    rest.forEach((e,i)=>{const r=rs[i],b=base(e),side=r.left+r.width/2<960?1:-1;e.style.transformOrigin=`${960-r.left}px ${540-r.top}px`;
      add((t,d)=>{const q=pop((t-i*.03)/(IN*1.4)),k=t/d;e.style.transform=`rotate(${-9*(1-q)}deg) scale(${1+.22*(1-q)+.02*k}) translateY(${(1-q)*side*260}px) ${b}`})})});
  else if(rest.length)late.push(()=>{const rs=rest.map(e=>e.getBoundingClientRect()),single=rest.length===1;
    rest.forEach((e,i)=>{const r=rs[i],b=base(e),cx=r.left+r.width/2-960,cy=r.top+r.height/2-540,len=Math.hypot(cx,cy)||1;
      let fx=0,fy=200;if(!single){if(Math.abs(cx)/960>Math.abs(cy)/540){fx=Math.sign(cx||1)*520;fy=0}else{fx=0;fy=Math.sign(cy||1)*460}}
      const s0=single?.84:.94,dl=i*.05,dx=cx/len*14,dy=cy/len*14;
      add((t,d)=>{const q=pop((t-dl)/IN),k=t/d;e.style.transform=`translate(${(1-q)*fx+dx*k}px,${(1-q)*fy+dy*k}px) rotate(${(1-q)*(single?5:i%2?8:-8)}deg) scale(${(s0+(1-s0)*q)*(single?1+.03*k:1)}) ${b}`})})});
  // Walls. The burst grid drops in and reshuffles on the eighth; then the character zips through the middle and the
  // work changes again in its wake. The closing wall zooms out from its middle tile.
  const tiles=cards.filter(e=>e.classList.contains('tile'));
  if(tiles.length&&T.startsWith('Grid')){const D=240,bx=t=>-D+(1920+2*D)*(t-.3)/.45;
    tiles.forEach((e,i)=>{const col=i%3,dl=col*.04+Math.floor(i/3)*.02,dy=col%2?700:-700,ims=[...e.querySelectorAll('img')],cx=parseFloat(e.style.left)+parseFloat(e.style.width)/2;
      e.style.transformOrigin=`${960-parseFloat(e.style.left)}px ${540-parseFloat(e.style.top)}px`;
      add(t=>{const q=pop((t-dl)/IN);e.style.transform=`rotate(${-8*(1-q)}deg) translateY(${(1-q)*dy}px)`;const s=Math.min(ims.length-1,t<.26?0:bx(t)+D*.3<cx?1:2);ims.forEach((im,j)=>{im.style.display=j===s?'block':'none'})})});
    add(t=>{if(t<.3||t>.76)return ball.hide();ball.at(bx(t),540-Math.sin(clamp((t-.3)/.45)*Math.PI)*40,D,{pose:'fly',rot:6,trail:1})})}
  else if(tiles.length){tiles.forEach(e=>{e.style.transformOrigin=`${960-parseFloat(e.style.left)}px ${540-parseFloat(e.style.top)}px`});
    add((t,d)=>{const q=io(t/(d*.85));tiles.forEach((e,i)=>{const col=i%3;e.style.transform=`rotate(${-9*(1-q)}deg) scale(${1+.6*(1-q)}) translateY(${(col%2?-1:1)*160*(1-q)}px)`})})}
  // Pieces of a flat-colour image: a row springs up one after another; a single piece takes one of three entrances.
  const pcs=[...f.querySelectorAll('.piece')];
  if(pcs.length>1)pcs.forEach((e,i)=>{const dy=i%2?-460:460,dl=i*.05,dr=(i-(pcs.length-1)/2)*8;add((t,d)=>{const q=pop((t-dl)/IN),k=t/d;e.style.transform=`translate(${dr*k}px,${(1-q)*dy}px) rotate(${(1-q)*(i%2?-7:7)}deg) scale(${.94+.06*q})`})});
  if(pcs.length===1){const e=pcs[0],k=n%3;add((t,d)=>{const q=pop(t/IN),kk=t/d;
    e.style.transform=k===0?`translateY(${(1-q)*380}px) rotate(${(1-q)*4}deg) scale(${(.9+.1*q)*(1+.025*kk)})`:k===1?`scale(${(1.2-.2*ease(t/.26))*(1+.02*kk)})`:`translateX(${(1-q)*640}px) scale(${1+.02*kk})`})}
  // Cut 5's walls: the columns slide past one another. Cut 5's rows: the row slides across, each piece popping up or
  // down into place.
  const mcols=[...f.querySelectorAll('.mcol')];
  if(mcols.length)late.push(()=>{const bs=mcols.map((c,i)=>mbase(c,i));add((t,d)=>{const p=t/d;mcols.forEach((c,i)=>{c.style.transform=`translateY(${bs[i]+(i%2?1:-1)*(p-.5)*900}px)`})})});
  const mrow=f.querySelector('.mrow');
  if(mrow){const rot=+mrow.dataset.rot||0,ph=[...mrow.children];late.push(()=>{const tw=mrow.scrollWidth;add((t,d)=>{const p=t/d;
    mrow.style.transform=`translateX(${60+(1920-tw-80)*io(p)}px) rotate(${rot}deg)`;
    ph.forEach((e,i)=>{const q=pop((t-i*.025)/IN);e.style.transform=`translateY(${(1-q)*(i%2?220:-220)}px) rotate(${(1-q)*(i%2?8:-8)}deg)`})})})}
  // Full frames take turns. Wipe, lens and push reveal it over the last frame of the shot before.
  const cover=f.querySelector('img.cover');
  if(cover){const mode=(under?['zoom','wipe','hold','iris','zoom','push']:['zoom','hold'])[n%(under?6:2)];
    if(mode==='zoom')add((t,d)=>{cover.style.transform=`scale(${(1+.32*(1-ease(t/.28)))*(1+.02*t/d)})`});
    if(mode==='hold')add((t,d)=>{cover.style.transform=`scale(${1.06-.06*io(t/d)})`});
    if(mode==='wipe'){showUnder();add((t,d)=>{f.style.clipPath=`inset(0 ${(1-ease(t/.24))*100}% 0 0)`;cover.style.transform=`scale(${1.05-.05*io(t/d)})`})}
    if(mode==='iris'){showUnder();add((t,d)=>{f.style.clipPath=`circle(${ease(t/.26)*1110}px at 50% 50%)`;cover.style.transform=`scale(${1.04-.04*io(t/d)})`})}
    if(mode==='push'){showUnder();add((t,d)=>{const q=ease(t/.26);f.style.transform=`translateX(${(1-q)*1920}px)`;under.style.transform=`translateX(${-q*1920}px)`;cover.style.transform=`scale(${1+.03*t/d})`})}}
  }
  window.anim=(t,d)=>{late.splice(0).forEach(fn=>fn());AN.forEach(a=>a(t,d))};
})();
window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>console.log('MISSING '+i.src)))).then(()=>document.fonts.ready).then(()=>CH3D_READY).then(()=>{LAYOUT.forEach(fn=>fn())});
</script></body></html>

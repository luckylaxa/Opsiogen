<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Outfit;src:url(../../src/fonts/Outfit-Variable.woff2) format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}body{width:1440px;height:810px;font-family:Outfit,sans-serif;color:#fff;background:#07070c;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:url(concept-01-arrival.png) center/cover}
.top{position:absolute;inset:0 0 auto 0;height:260px;background:linear-gradient(#05050acc,#05050a00)}
.bot{position:absolute;inset:auto 0 0 0;height:300px;background:linear-gradient(#05050a00,#05050ab0)}
nav{position:absolute;left:48px;right:48px;top:30px;display:flex;align-items:center;justify-content:space-between;font-size:16px}
nav img{height:30px}nav .l{display:flex;gap:34px;align-items:center;opacity:.9}
.btn{background:#f6f4f7;color:#0b0b10;border-radius:6px;padding:12px 20px;font-weight:500;font-size:15px}
.word{position:absolute;left:0;right:0;top:92px;text-align:center;font-weight:700;font-size:214px;letter-spacing:-.02em;line-height:1;color:#fff;opacity:.13}
.tag{position:absolute;left:48px;bottom:192px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
h1{position:absolute;left:48px;bottom:46px;font-weight:700;font-size:40px;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;max-width:520px}
.cta{position:absolute;right:48px;bottom:50px;display:flex;gap:12px;align-items:center}
.ghost{border:1px solid #ffffff55;border-radius:6px;padding:12px 20px;font-size:15px}
.scroll{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.8}
.scroll i{display:block;margin:10px auto 0;width:22px;height:34px;border:1.5px solid #fff;border-radius:12px;position:relative}
.scroll i:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;background:#fff;border-radius:2px}
.dots{position:absolute;right:30px;top:50%;transform:translateY(-50%);display:grid;gap:14px}
.dots b{width:7px;height:7px;border-radius:50%;background:#ffffff55;display:block}.dots b:first-child{background:#fff;box-shadow:0 0 0 4px #ffffff22}
</style></head><body>
<div class="bg"></div><div class="top"></div><div class="bot"></div>
<div class="word">OPSIOGEN</div>
<nav><img src="../../src/assets/opsiogen-logo-on-dark.png"><div class="l"><span>Work</span><span>Services</span><span>About</span><span class="btn">Start a project</span></div></nav>
<div class="tag">AI-first design and digital company</div>
<h1>Your digital department, without the hiring.</h1>
<div class="scroll">Scroll to step inside<i></i></div>
<div class="cta"><span class="btn">See our work</span><span class="ghost">Our services</span></div>
<div class="dots"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>
</body></html>
